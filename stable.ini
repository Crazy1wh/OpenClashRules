[custom]
; OpenClash subscription convert template - stable version
; Repository: https://github.com/Crazy1wh/OpenClashRules
; Usage: put this file URL in subconverter config/custom template, not in rule-provider.
; Important: do not enable Node List / list=true when converting, otherwise only proxies will be generated.

; Rulesets from Crazy1wh/OpenClashRules
ruleset=🎯 全球直连,https://raw.githubusercontent.com/Crazy1wh/OpenClashRules/main/Direct.list
ruleset=🚀 节点选择,https://raw.githubusercontent.com/Crazy1wh/OpenClashRules/main/ProxyLite.list
ruleset=🤖 AI,https://raw.githubusercontent.com/Crazy1wh/OpenClashRules/main/AI.list

; Common base rules
ruleset=🎯 全球直连,https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/LocalAreaNetwork.list
