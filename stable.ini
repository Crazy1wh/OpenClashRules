ruleset=🎯 全球直连,[]GEOSITE,CN
ruleset=🚀 节点选择,[]GEOSITE,geolocation-!cn
ruleset=🎯 全球直连,[]GEOIP,CN,no-resolve
ruleset=🐟 漏网之鱼,[]FINAL

; Main proxy groups
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]🇭🇰 香港节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇺🇸 美国节点`[]🌐 其他地区`[]🕊️ 低倍率节点`[]🐸 手动切换`[]DIRECT
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=🐸 手动切换`select`.*

; Region groups
custom_proxy_group=🇭🇰 香港节点`select`(?=.*(香港|HK|Hong Kong|HongKong|🇭🇰))^((?!(剩余|流量|套餐|官网|客服|过期|Expire|Traffic)).)*$
custom_proxy_group=🇯🇵 日本节点`select`(?=.*(日本|东京|大阪|JP|Japan|🇯🇵))^((?!(剩余|流量|套餐|官网|客服|过期|Expire|Traffic)).)*$
custom_proxy_group=🇸🇬 新加坡节点`select`(?=.*(新加坡|坡|狮城|SG|Singapore|🇸🇬))^((?!(剩余|流量|套餐|官网|客服|过期|Expire|Traffic)).)*$
custom_proxy_group=🇺🇸 美国节点`select`(?=.*(美国|洛杉矶|圣何塞|硅谷|US|USA|United States|🇺🇸))^((?!(剩余|流量|套餐|官网|客服|过期|Expire|Traffic)).)*$
custom_proxy_group=🌐 其他地区`select`(^(?!.*(香港|HK|Hong Kong|HongKong|日本|东京|大阪|JP|Japan|新加坡|坡|狮城|SG|Singapore|美国|洛杉矶|圣何塞|硅谷|US|USA|United States|剩余|流量|套餐|官网|客服|过期|Expire|Traffic)).*)
custom_proxy_group=🕊️ 低倍率节点`select`(?=.*(0\.5|0.5|0\.5倍|0.5倍|0\.5x|0.5x|1x|1倍))^((?!(剩余|流量|套餐|官网|客服|过期|Expire|Traffic)).)*$

